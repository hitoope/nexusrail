<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS Rail on LinkedIn</title>

<!-- Página puente para el código QR de NEXUS Rail.
     PARA CAMBIAR EL DESTINO: sustituye la URL en los TRES sitios de este
     fichero donde aparece linkedin.com/company/nexusrail
       1) el <meta http-equiv="refresh"> de aquí debajo
       2) el enlace de reserva del cuerpo
       3) el location.replace() del <script> final
     Los tres deben coincidir. -->
<meta http-equiv="refresh" content="0; url=https://www.linkedin.com/company/nexusrail/">

<!-- No debe indexarse: es un redireccionador, no contenido. -->
<meta name="robots" content="noindex, follow">

<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #000; color: #e9e8e6;
    font-family: Montserrat, -apple-system, system-ui, "Segoe UI", sans-serif;
    text-align: center; padding: 1.5rem;
  }
  .rule { width: 2rem; height: 2px; background: #db0b17; margin: 0 auto 1.5rem; }
  h1 { font-size: 1.125rem; font-weight: 700; letter-spacing: .01em; margin: 0 0 .75rem; }
  p  { font-size: .9375rem; line-height: 1.6; color: #a8a6a2; margin: 0 0 1.5rem; }
  a  { color: #ff3a45; text-decoration: underline; text-underline-offset: 3px; }
  a:hover { color: #ff858c; }
</style>
</head>
<body>
  <main>
    <div class="rule"></div>
    <h1>Taking you to LinkedIn&hellip;</h1>
    <p>NEXUS Rail &mdash; System &amp; Safety Assurance</p>
    <!-- Enlace de reserva: visible si el navegador bloquea la redirección -->
    <p><a href="https://www.linkedin.com/company/nexusrail/">Continue to our LinkedIn page</a></p>
  </main>
  <script>
    /* replace() en lugar de assign(): así el botón Atrás devuelve al
       usuario a donde estaba, y no a esta página, que le rebotaría otra vez. */
    location.replace("https://www.linkedin.com/company/nexusrail/");
  </script>
</body>
</html>
